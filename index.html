                    <option value="IT Guy">IT Guy</option>
                    <option value="Receptionist">Receptionist</option>
                    <option value="Security">Security</option>
                    <option value="Manager">Manager</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Other">Other</option>
                </select>
                                    <span id="err_select" class="color"></span>

                                           </ul>
                                <div class="flex flex-col items-center">

                        <button class="border w-[90px] h-[20px] bg-blue-500" type="button" onclick="addexpr()">add experience</button>
                        </div>
                        
                    
                    </div>
                <div class="w-[90%] flex flex-col gap-1">
               <label for="name" class=" text-sm font-medium text-gray-700">Email:</label>
               <input type="text" id="email" name="email"  class="border h-[40px] p-2 rounded" >
               <span id="err_email" class="color"></span>
           </div>
            <div class="w-[90%] flex flex-col gap-1">
               <label for="name" class=" text-sm font-medium text-gray-700">Phone:</label>
               <input type="text" id="phone" name="phone"  class="border h-[30px] p-2 rounded" >
