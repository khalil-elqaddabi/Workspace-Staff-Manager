                    </div>
                    <button class="border cursor-pointer mb-[5px] text-2xl w-[15rem] h-[5rem] rounded-md bg-blue-500" id="addWorkerBtn">add a worker</button>
                   
                </div>
            </nav>
            <div class=" floor_container w-[800px] h-[500px] flex items-center justify-end">
            <div class="floor_plan  border  w-[800px] h-[400px] bg-white">
                <div class="div1 div flex flex-col  gap-4 items-center justify-center">
                    <p>Salle de conférence </p>
                    <button class="bg-blue-500 w-[30px] h-[20px] rounded-[40%] flex items-center justify-center cursor-pointer">+</button>
                </div>
                <div class="div2  div flex flex-col  gap-4 items-center justify-center">
                <p>Réception </p>
                <button class="bg-blue-500 w-[30px] h-[20px] rounded-[40%] flex items-center justify-center cursor-pointer">+</button>

                </div>
                <div class="div3 div flex flex-col gap-4 items-center justify-center">
                    <p>Salle des serveurs </p>
                    <button class="bg-blue-500 w-[30px] h-[20px] rounded-[40%] flex items-center justify-center cursor-pointer">+</button>
                </div>
                <div class="div4 div flex flex-col  gap-4 items-center justify-center">
                    <p>Salle de sécurité</p>

                </div>
                
            </div>
        </div>

    <!-- h -->
    <div class="w-[100%] h-full absolute   hidden worker_form " id="addWorkerForm">
    <form id="addWorkerForm"  class=" form_worker border w-[500px] h-[550px] flex flex-col gap-4 p-4 bg-white items-center m-auto mt-[2rem] ">
                <!-- <input type="text" placeholder="Name"  />
                <input type="text" placeholder="Role"  />
                Add more fields as needed

                <div class="w-[100%] flex items-center justify-between ">
                <h2 class="text-blue-500 text-2xl mb-[20px]"><b>Add Worker</b></h2>
                <button class="text-red-500 text-2xl mb-[10px] " type="button" id="hideWorkerForme"><b>X</b></button>
                </div>
                <div class="w-[100%] flex items-center flex-col overflow-y-scroll  h-[100%] gap-4">
                <div class="w-[90%] flex flex-col gap-1">
                    <label for="name" class=" text-sm font-medium text-gray-700" >Name:</label>
                    <input type="text" id="name" class="border h-[40px] p-2 rounded" placeholder="Enter name">
                    <span id="err_name" class="color"></span>
                </div>
                <div class="w-[90%] flex flex-col gap-1 ">
                    <label for="name" class=" text-sm font-medium text-gray-700">Role:</label>
                    <select name="" id="role" class="border rounded h-[40px]">
                        <option value="none">select</option>
                        <option value="Réception">Réception</option>
                        <option value="Salle des serveurs ">Salle des serveurs </option>
                        <option value="Salle de sécurité">Salle de sécurité</option>
                        <option value="Manager">Manager</option>
                        <option value="Nettoyage ">Nettoyage </option>
                        <option value="Autres rôles ">Autres rôles </option>
                    </select>
                    <span id="err_select" class="color"></span>
                </div>
                <div class="flex flex-col items-center w-[90%] flex flex-col gap-4">
                    <label><b>YOUR PECTURE URL :</b></label>
                    <input type="text" id="inputphoto" class="border w-[100%] h-[35px] p-2" placeholder="URL">
                    <img src="" alt="" id="loudingphoto" class="w-[60px] h-[60px] rounded-full border">
                       
                       
                  <input type="file" id="photo" class="hidden">
                </div>

                <div class="w-[90%] flex flex-col gap-2">
                    <h3><b>Experience</b></h3>
                     <ul id="expr" class="w-[100%]">
                   
                                           </ul>
                                <div class="flex flex-col items-center">

                        <button class="border w-[90px] h-[20px] bg-blue-500" type="button" onclick="addexpr()">add experience</button>
                        </div>
                        
                    
                    </div>
                <div class="w-[90%] flex flex-col gap-1">
               <label for="name" class=" text-sm font-medium text-gray-700">Email:</label>
               <input type="text" id="email" name="email"  class="border h-[40px] p-2 rounded" >
               <span id="err_email" class="color"></span>
           </div>
            <div class="w-[90%] flex flex-col gap-1">
               <label for="name" class=" text-sm font-medium text-gray-700">Phone:</label>
               <input type="text" id="phone" name="phone"  class="border h-[30px] p-2 rounded" >
               <span id="err_phone" class="color"></span>
           </div>
           <div>
            <button class="bg-blue-500 w-[100px] h-[35px] rounded-md text-white" type="button" onclick="addWorker()">Save Worker</button>
            <button class="bg-gray-500 w-[100px] h-[35px] rounded-md text-white" type="submit" id="canceladd">Cancel</button>
            
           </div>
                </div>
                
    </form>
    </div>
    <!-- view worker details -->
   <!-- VIEW WORKER DETAILS MODAL -->
<div id="viewWorkerForm" class="w-[100%] h-screen absolute items-center pl-[30%] pr-[30%] pb-[60px] worker_form" style="display:none;">
    <form id="viewWorkerDetailsForm" class="border w-[500px] h-[500px] flex flex-col gap-4 p-4 bg-white items-center">
        <div class="w-[100%] flex items-center justify-between bg-blue-200 p-2 rounded-md ">
            <h2 class="text-blue-500 text-2xl mb-[20px]"><b>Worker Details</b></h2>
            <button class="text-red-500 text-2xl mb-[10px]" type="button" id="hideviewerForme"><b>X</b></button>
        </div>
        <div class="w-[100%] flex items-center flex-col overflow-y-scroll bg-blue-200 h-[100%] gap-4">
            <div class="w-[90%] flex flex-col gap-1">
                <label>Name:</label>
                <p id="viewName"></p>
            </div>
            <div class="w-[90%] flex flex-col gap-1">
                <label>Role:</label>
                <p id="viewRole"></p>
            </div>
            <div class="flex flex-col items-center">
                <img id="viewPhoto" class="w-28 h-28 rounded-full" alt="Photo">
            </div>
            <div class="w-[90%] flex flex-col gap-1">
                <label>Email:</label>
                <p id="viewEmail"></p>
            </div>
            <div class="w-[90%] flex flex-col gap-1">
                <label>Phone:</label>
                <p id="viewPhone"></p>
            </div>
            <div class="w-[90%] flex flex-col gap-2">
                <h3><b>Experiences</b></h3>
                <div id="someExperienceDiv"></div>
            </div>
        </div>
    </form>
</div>
